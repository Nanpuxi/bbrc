[package]
name = "app"
version = "0.1.0"
description = "AARC 编辑器最小 Tauri 宿主"
authors = ["Au"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# 安卓公共目录（相册）写入；与前端 tauri-plugin-android-fs-api 版本必须严格一致
tauri-plugin-android-fs = { version = "=29.0.0", features = ["legacy_storage_permission"] }

# 体积优化：优先缩小 .so（APK 体积的大头）
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
